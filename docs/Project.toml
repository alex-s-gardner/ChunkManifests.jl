[deps]
ChunkManifests = "558bc7c3-2be7-4981-9bcf-ba6cea128854"
Documenter = "e30172f5-a6a5-5a46-863b-614d45cd2de4"
HDF5 = "f67ccb44-e63f-5c2f-98bd-6dc0ccc4ba2f"
Zarr = "0a941bbe-ad1d-11e8-39d9-ab76183a1d99"
ZarrCore = "77f5b75c-4c08-499f-ba13-550b0a0af171"
ZarrZlib = "5ee7c756-6ac8-46ad-a53f-994846513443"

[sources]
ChunkManifests = {path = ".."}
# `[sources]` is honored only in the active project, so the pin in the root
# Project.toml does not reach this environment and has to be repeated. Keep the
# two in step: a docs build against registered Zarr resolves a different
# version than the test suite runs on.
Zarr = {url = "https://github.com/alex-s-gardner/Zarr.jl", rev = "complex-int-dtype-v0.11", subdir = "Zarr"}
ZarrCore = {url = "https://github.com/alex-s-gardner/Zarr.jl", rev = "complex-int-dtype-v0.11", subdir = "ZarrCore"}
ZarrZlib = {url = "https://github.com/alex-s-gardner/Zarr.jl", rev = "complex-int-dtype-v0.11", subdir = "ZarrZlib"}

[compat]
Documenter = "1"
HDF5 = "0.17"
Zarr = "0.11"
ZarrCore = "0.11.1"
ZarrZlib = "0.11"
# Above the package's own lower bound: `[sources]` needs Julia 1.11.
julia = "1.11"
